name: Zotero Auto Sync
on:
  schedule:
    - cron: '0 15 * * *' # 毎日日本時間の深夜0時に実行
  workflow_dispatch:      # 手動実行ボタンも作成

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: {python-version: '3.x'}
      - name: Install dependencies
        run: pip install requests
      - name: Run sync script
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: python update_lit.py
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add literature_list.md
          git commit -m "Automated Zotero sync" || exit 0
          git push
