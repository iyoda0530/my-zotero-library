name: Zotero Auto Sync
on:
  schedule:
    - cron: '*/15 * * * *' # 15分ごとに実行（ここでお好みの間隔に調整）
  workflow_dispatch:      # 手動実行ボタンも作成

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: {python-version: '3.x'}
      - name: Install dependencies
        run: pip install requests
      - name: Run sync script
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: python update_lit.py

      - name: Upload to Google Drive
        uses: pieceofquality/google-drive-upload-action@v1
        with:
          path: "literature_list.md"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          # サービスアカウントではなく、フォルダ所有者の容量を使うための魔法の設定
          serviceAccountKey: ${{ secrets.GDRIVE_CREDENTIALS }}
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 変更があるファイル（.mdとlast_version.txt）があればCommit
          git add literature_list.md last_version.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: Zotero update detected" && git push)
